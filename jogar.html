<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chove no Recife | Jogar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="chuva" aria-hidden="true"></div>
  <!-- A água sobe a cada decisão: o jogo.js muda a altura deste elemento -->
  <div class="agua" id="agua" aria-hidden="true"></div>

  <header>
    <a class="letreiro" href="index.html">CENTRO &gt; CASA</a>
    <nav>
      <a href="index.html">Início</a>
      <a href="jogar.html" class="ativo">Jogar</a>
      <a href="meu-recife.html">Meu Recife</a>
      <a href="finais.html">Finais</a>
    </nav>
  </header>

  <main class="bloco jogo">
    <div class="barras">
      <label>🔋 Bateria <progress id="bateria" max="100"></progress></label>
      <label>💰 Dinheiro <progress id="dinheiro" max="100"></progress></label>
      <label>😤 Paciência <progress id="paciencia" max="100"></progress></label>
    </div>

    <p class="mudanca" id="mudanca" role="status"></p>

    <article class="cena" id="cena">
      <p class="hora" id="local"></p>
      <h1 id="titulo"></h1>
      <p id="texto"></p>
      <div class="opcoes" id="opcoes"></div>
    </article>
  </main>

   <footer>Trabalho autoral de HTML, CSS e JavaScript.</footer>

  <script src="js/cenas.js"></script>
  <script src="js/jogo.js"></script>
</body>
</html>
